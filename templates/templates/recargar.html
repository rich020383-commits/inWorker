<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inWorker - Cargar Billetera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl p-6 shadow-xl text-center">
        <i class="fas fa-university text-blue-600 text-4xl mb-3"></i>
        <h2 class="text-xl font-black text-slate-900 uppercase tracking-wide">Cargar Créditos inWorker</h2>
        <p class="text-xs text-slate-400 mt-1">Elige un paquete para fondear tus órdenes técnicas de manera segura.</p>

        <form action="/recargar_billetera" method="POST" class="mt-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
    <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition active:scale-95">
        <input type="radio" name="creditos" value="1" checked class="hidden">
        <span class="text-sm font-black text-slate-800">1 Crédito</span>
        <span class="text-xs text-blue-600 font-bold mt-0.5">$10.000 COP</span>
    </label>

    <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition active:scale-95">
        <input type="radio" name="creditos" value="2" class="hidden">
        <span class="text-sm font-black text-slate-800">2 Créditos</span>
        <span class="text-xs text-blue-600 font-bold mt-0.5">$20.000 COP</span>
    </label>
</div>

            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-left flex items-start space-x-2">
                <i class="fas fa-info-circle text-amber-600 mt-0.5 text-xs"></i>
                <p class="text-[11px] text-amber-800 leading-normal font-medium">
                    <strong>Modo Sandbox / Pruebas:</strong> Al presionar el botón se inyectará el saldo directamente a tu cuenta de simulación comercial sin generar cobros reales.
                </p>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 px-4 rounded-xl text-xs transition uppercase tracking-wider shadow-md">
                ✔ Confirmar Transacción de Prueba
            </button>
            
            <a href="javascript:history.back()" class="block text-xs text-slate-400 font-medium hover:text-slate-600 pt-2 transition">
                Volver atrás
            </a>
        </form>
    </div>

</body>
</html>
