<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargar Billetera - inWorker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen pb-20 flex flex-col relative">
    
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center gap-3">
            <a href="/dashboard" class="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition border border-slate-200">
                <i class="fas fa-arrow-left text-xs"></i>
            </a>
            <h1 class="text-sm font-black tracking-tight text-slate-900 uppercase">Billetera <span class="text-blue-500">in</span>Worker</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="bg-slate-900 rounded-3xl p-6 shadow-xl mb-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full blur-3xl opacity-20 -mr-10 -mt-10"></div>
            <h2 class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">Saldo Disponible</h2>
            <div class="flex items-end gap-2">
                <span class="text-4xl font-black text-white">{{ saldo }}</span>
                <span class="text-blue-400 font-bold mb-1">Créditos</span>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-wide mb-4">
                <i class="fas fa-bolt text-blue-500 mr-2"></i>Nueva Recarga
            </h3>
            
            <form action="/recargar_billetera" method="POST" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 mb-3">¿Cuántos créditos deseas recargar?</label>
                    <div class="flex items-center gap-4">
                        <button type="button" onclick="ajustarCreditos(-1)" class="w-14 h-14 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-black text-2xl transition flex items-center justify-center">-</button>
                        
                        <input type="number" id="input-creditos" name="creditos" value="1" min="1" max="100" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl text-center h-14 text-2xl font-black text-slate-900 focus:outline-none focus:border-blue-500 transition" onchange="calcularTotal()" onkeyup="calcularTotal()">
                        
                        <button type="button" onclick="ajustarCreditos(1)" class="w-14 h-14 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-black text-2xl transition flex items-center justify-center">+</button>
                    </div>
                    <p class="text-[9px] text-slate-400 mt-2 font-medium text-center">Límite máximo por transacción: 100 Créditos ($1,000,000 COP)</p>
                </div>

                <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-5 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-600">Total a pagar:</span>
                    <span class="text-xl font-black text-blue-700" id="total-cop">$10.000 COP</span>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-md flex items-center justify-center space-x-2 active:scale-95">
                    <i class="fas fa-lock mr-1"></i>
                    <span>Ir a Pagar Seguro</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        // Magia JavaScript para calcular el precio en vivo sin recargar la página
        function ajustarCreditos(cambio) {
            const input = document.getElementById('input-creditos');
            let valor = parseInt(input.value) || 0;
            valor += cambio;
            if (valor < 1) valor = 1;
            if (valor > 100) valor = 100;
            input.value = valor;
            calcularTotal();
        }

        function calcularTotal() {
            const input = document.getElementById('input-creditos');
            let valor = parseInt(input.value) || 0;
            if (valor < 1) valor = 1;
            if (valor > 100) valor = 100;
            
            const total = valor * 10000;
            document.getElementById('total-cop').innerText = '$' + total.toLocaleString('es-CO') + ' COP';
        }
        
        // Ejecutar cálculo al iniciar la vista
        document.addEventListener("DOMContentLoaded", calcularTotal);
    </script>
</body>
</html>
