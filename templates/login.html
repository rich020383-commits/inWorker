<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inWorker - Acceso Centralizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white w-full max-w-md p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xl text-center">
        
        <div class="flex flex-col items-center justify-center mb-6 select-none">
            <svg class="w-20 h-20 mb-2" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="25" cy="20" r="8" fill="#2563EB"/>
                <path d="M17 38 C17 38, 17 65, 17 65 C17 73, 27 75, 33 70 C38 65, 45 58, 45 58" stroke="#2563EB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="75" cy="20" r="8" fill="#22C55E"/>
                <path d="M83 38 C83 38, 83 65, 83 65 C83 73, 73 75, 67 70 C62 65, 55 58, 55 58" stroke="#22C55E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M43 56 L48 61 L57 52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1 class="text-3xl font-black tracking-tight text-slate-900 leading-none">
                <span class="text-[#2563EB]">in</span>Worker
            </h1>
            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mt-2">
                Conecta Talento con <span class="text-[#22C55E]">Oportunidades</span>
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert p-3.5 rounded-xl text-xs text-left mb-5 border leading-relaxed
                {% if category == 'error' %} bg-red-50 border-red-200 text-red-700
                {% else %} bg-green-50 border-green-200 text-green-700 {% endif %}" 
                id="flash-message-box" data-category="{{ category }}">
                <i class="fas {% if category == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %} mr-1.5"></i>
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="flex border-b border-slate-200 mb-6 select-none">
            <div class="flex-1 pb-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600 cursor-pointer transition-all duration-200" id="tab-login" onclick="cambiarPestaña('login')">
                Ingresar
            </div>
            <div class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-600 cursor-pointer transition-all duration-200" id="tab-registro" onclick="cambiarPestaña('registro')">
                Registrarse
            </div>
        </div>

        <form id="form-login" method="POST" action="/login" class="space-y-4">
            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Correo Electrónico</label>
                <input type="email" name="correo" placeholder="ejemplo@inworker.com" required autocomplete="username"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Contraseña</label>
                <div class="relative">
    <input type="password" id="pass_login" name="contrasena" placeholder="••••••••" required autocomplete="current-password"
        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
    <button type="button" onclick="togglePassword('pass_login', 'icon_login')" class="absolute right-4 top-3.5 text-slate-400 hover:text-blue-600 transition-colors">
        <i class="fas fa-eye" id="icon_login"></i>
    </button>
</div>
                
                <div class="text-right pt-1.5">
                    <a href="/recuperar-contrasena" class="text-xs font-semibold text-blue-600 hover:text-blue-700 hover:underline transition-colors">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
            </div>
            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-3.5 px-4 rounded-xl text-xs uppercase tracking-wider transition-all shadow-md active:scale-[0.98] mt-2">
                Iniciar Sesión <i class="fas fa-sign-in-alt ml-1"></i>
            </button>
        </form>

        <form id="form-registro" method="POST" action="/registrar" class="space-y-4" style="display: none;">
            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Nombre Completo / Razón Social</label>
                <input type="text" name="nombre" placeholder="Ej. Andrés Mendoza" required autocomplete="name"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Número de Cédula (CC / NIT)</label>
                <input type="text" name="cedula" placeholder="Ej: 1042XXXXXX" required inputmode="numeric" pattern="[0-9]+" title="Por favor, ingrese únicamente números sin puntos ni guiones." autocomplete="off"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Correo Electrónico</label>
                <input type="email" name="correo" placeholder="andres@inworker.com" required autocomplete="email"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Número Celular / Contacto Directo</label>
                <input type="tel" name="telefono" placeholder="Ej: 3001234567" required pattern="[0-9]{10}" title="El número celular debe contener exactamente 10 dígitos numéricos." autocomplete="tel"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Contraseña Central</label>
                <input type="password" name="contrasena" placeholder="Crea una contraseña segura" required autocomplete="new-password"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            
            <div class="text-left space-y-1">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Tipo de Perfil (Rol)</label>
                <select name="rol" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500 transition-colors">
                    <option value="Trabajador">Ofrecer mis servicios (Trabajador)</option>
                    <option value="Cliente">Contratar servicios (Cliente)</option>
                </select>
            </div>

            <div class="flex items-start gap-2.5 text-left pt-1 px-1">
                <input type="checkbox" name="acepta_terminos" id="acepta_terminos" required 
                    class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500 accent-blue-600 mt-0.5 flex-shrink-0 cursor-pointer">
                <label for="acepta_terminos" class="text-[11px] text-slate-500 leading-normal cursor-pointer select-none">
                    Acepto de manera voluntaria los <a href="/terminos-y-condiciones" target="_blank" class="text-blue-600 font-bold hover:underline">Términos y Condiciones de Uso</a> y la Política de Tratamiento de Datos Personales de inWorker.
                </label>
            </div>

            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-3.5 px-4 rounded-xl text-xs uppercase tracking-wider transition-all shadow-md active:scale-[0.98] mt-2">
                Crear Mi Cuenta <i class="fas fa-user-plus ml-1"></i>
            </button>
        </form>
    </div>

    <script>
        function cambiarPestaña(tipo) {
            const formLogin = document.getElementById('form-login');
            const formRegistro = document.getElementById('form-registro');
            const tabLogin = document.getElementById('tab-login');
            const tabRegistro = document.getElementById('tab-registro');

            if (tipo === 'login') {
                formLogin.style.display = 'block';
                formRegistro.style.display = 'none';
                
                tabLogin.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600 cursor-pointer transition-all duration-200";
                tabRegistro.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-600 cursor-pointer transition-all duration-200";
            } else {
                formLogin.style.display = 'none';
                formRegistro.style.display = 'block';
                
                tabLogin.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-600 cursor-pointer transition-all duration-200";
                tabRegistro.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600 cursor-pointer transition-all duration-200";
            }
        }

        // Leer alertas flash y abrir pestaña de registro si el error corresponde a esa sección
        document.addEventListener("DOMContentLoaded", function() {
            const alertBox = document.getElementById('flash-message-box');
            if (alertBox) {
                const mensaje = alertBox.innerText.toLowerCase();
                if (mensaje.includes("registro") || mensaje.includes("cédula") || mensaje.includes("ya existe") || mensaje.includes("registrado") || mensaje.includes("obligatorio aceptar")) {
                    cambiarPestaña('registro');
                }
            }

            function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = "password";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');
            let rol = urlParams.get('rol');

            if (action === 'registro') {
                cambiarPestaña('registro');
            } else if (action === 'login') {
                cambiarPestaña('login');
            }

            // Sincronizar el valor exacto del rol con las opciones de tu formulario en español
            if (rol) {
                if (rol === 'Worker') rol = 'Trabajador'; // Mapeo de la landing hacia el <option> real
                const selectRol = document.querySelector('select[name="rol"]');
                if (selectRol) {
                    selectRol.value = rol;
                }
            }
        });
    </script>
</body>
</html>
