<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago - inWorker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://checkout.bold.co/library/boldPaymentButton.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 max-w-md w-full overflow-hidden">
        <div class="bg-slate-900 p-6 text-center">
            <h2 class="text-white font-black text-xl uppercase tracking-wider"><span class="text-blue-500">in</span>Worker Pay</h2>
            <p class="text-slate-400 text-xs mt-1">Plataforma Segura</p>
        </div>
        
        <div class="p-8">
            <div class="text-center mb-8">
                <p class="text-slate-500 text-sm font-bold uppercase tracking-wider mb-2">Total a Pagar</p>
                <h1 class="text-4xl font-black text-slate-900">${{ monto_pesos }} <span class="text-lg text-slate-400">COP</span></h1>
                <p class="text-xs text-blue-600 font-bold bg-blue-50 py-1.5 px-3 rounded-lg inline-block mt-3 border border-blue-100">
                    <i class="fas fa-coins mr-1"></i> Equivalente a {{ creditos }} Créditos
                </p>
            </div>

            <button id="btn-pagar-bold" class="w-full bg-[#E51246] hover:bg-[#C00D39] text-white font-black py-4 rounded-xl text-sm uppercase tracking-widest transition shadow-lg flex items-center justify-center space-x-3 active:scale-95">
                <i class="fas fa-lock"></i>
                <span>Pagar con Bold</span>
            </button>

            <p class="text-[10px] text-center text-slate-400 font-medium mt-4">
                Ref: {{ referencia_pago }} <br>
                Tus datos están protegidos por encriptación bancaria.
            </p>
            
            <div class="mt-6 text-center">
                <a href="/recargar_billetera" class="text-xs text-slate-500 hover:text-slate-800 font-bold transition">Cancelar y volver</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btn-pagar-bold').addEventListener('click', function() {
            // Verificamos si Bold cargó correctamente desde su nueva URL
            if (typeof BoldCheckout === 'undefined') {
                alert("¡Ups! No se pudo cargar la librería del banco Bold. Revisa tu conexión a internet o intenta recargar la página.");
                return;
            }

            try {
                // Instanciamos el botón con los parámetros exactos que pide el manual de Bold
                const checkout = new BoldCheckout({
                    orderId: "{{ referencia_pago }}",
                    currency: "COP",
                    amount: "{{ monto_pesos }}",
                    apiKey: "{{ bold_public_key }}",
                    integritySignature: "{{ firma_integridad }}",
                    description: "Recarga de {{ creditos }} créditos en inWorker",
                    redirectionUrl: "https://inworker.co/dashboard"
                });
                
                // ¡Abre la pasarela!
                checkout.open();
                
            } catch (error) {
                console.error("Error al abrir BoldCheckout:", error);
                alert("Ocurrió un error al intentar conectar con la pasarela bancaria.");
            }
        });
    </script>
</body>
</html>
